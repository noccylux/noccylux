# Re-renders assets/*.svg from the GitHub API once a day.
#
# The default GITHUB_TOKEN only sees public repositories. To include private
# repositories in the language and repository counts, add a classic personal
# access token with the `repo` and `read:user` scopes as the repository secret
# PROFILE_STATS_TOKEN. Only aggregate numbers are written to the cards.
name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "Update profile cards"
          git push origin "HEAD:${GITHUB_REF_NAME}"
